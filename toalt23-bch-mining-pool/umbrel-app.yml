description: |-
  Mine Bitcoin Cash (BCH) solo on your Umbrel. Minted runs a pruned Bitcoin Cash Node with a built-in SHA-256 stratum pool, so your NerdQaxe, Bitaxe, NerdAxe or Antminer gets its work straight from your own node. There are no pool fees and no third party in between, and every block you find pays the full reward to your own address.

  Follow your mining live:

  - Best share since the last block on a log scale, where 100% is a block, plus your top 5 shares of all time
  - The next block with its transactions, size, fees and reward
  - Pool hashrate over 1, 3 or 12 hours
  - Every worker with hashrate, share difficulty, best share and share count, plus its own chart in the details
  - Coinbase entropy: the extranonce of every worker and the last jobs
  - Found blocks on their way to 100 confirmations

  The pool supports version rolling (AsicBoost) and adjusts the share difficulty per worker. Every miner gets a random extranonce, renewed with every job for miners that support extranonce subscribe. You choose whether every, every 2nd, 3rd or 4th transaction update becomes a new job, or none until the next block.

  The node keeps only the newest 10 GB of blocks. The first sync downloads and checks the whole chain once and takes about a day; the app needs about 20 GB of free disk space. Once the node is in sync, set your Bitcoin Cash address in Settings (CashAddr, with or without the bitcoincash: prefix, as shown by Exodus, Electron Cash or Cashonize) and point your miners at the stratum address shown there, port 3335.

  Tip for AxeOS: its coinbase verification only knows Bitcoin address formats, not CashAddr, so turn it off for this pool.
