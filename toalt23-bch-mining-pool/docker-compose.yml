version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: toalt23-bch-mining-pool_web_1
      APP_PORT: 3000

  web:
    image: toalt23/bch-mining-pool-web:latest
    init: true
    restart: on-failure
    environment:
      APP_VERSION: "0.1.0"
      CHAIN_DIR: /chain
      RPC_HOST: toalt23-bch-mining-pool_bitcoind_1
      RPC_PORT: "8332"
      RPC_USER: bchrpc
      RPC_PASSWORD: ${APP_PASSWORD}
    volumes:
      # Read only: chainstate size and free disk space
      - ${APP_DATA_DIR}/data/bch:/chain:ro
    depends_on:
      - bitcoind

  bitcoind:
    image: toalt23/bchn:29.2.0-1
    init: true
    restart: on-failure
    # the node needs time to flush its databases on shutdown
    stop_grace_period: 3m
    environment:
      # Written to bitcoin.conf by the entrypoint
      RPC_USER: bchrpc
      RPC_PASSWORD: ${APP_PASSWORD}
      PRUNE_MIB: "10240"
    command:
      - bitcoind
      - -datadir=/data
      - -printtoconsole
      - -dbcache=512
    volumes:
      # Chain data; the image fixes ownership itself
      - ${APP_DATA_DIR}/data/bch:/data
