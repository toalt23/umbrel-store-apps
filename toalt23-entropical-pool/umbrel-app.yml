manifestVersion: 1
id: toalt23-entropical-pool
name: "Entropical Pool"
tagline: Solo-mine Bitcoin on your own node, with fresh entropy for every block
icon: https://raw.githubusercontent.com/toalt23/umbrel-store-apps/master/toalt23-entropical-pool/icon.svg?v=0.2.2
category: bitcoin
version: "0.3.3"
port: 3450
description: |-
  Solo-mine Bitcoin on your Umbrel, straight from your own Bitcoin Node app. Entropical Pool is a stratum pool for SHA-256 miners like NerdQaxe, Bitaxe, NerdAxe or Antminer. There are no pool fees and no third party: every block a miner finds pays the full reward to the Bitcoin address in its username.

  Fresh entropy with every job: each miner gets a random extranonce1, and miners that support extranonce.subscribe get a new one with every job, on a new block and on every transaction update. Nothing counts up from zero, nothing is reused.

  - Best share since the last block on a log scale, where 100% is a block
  - The next block with transactions, weight, fees and reward, plus a live check that your node would accept it
  - Pool hashrate over 1, 3 or 12 hours, workers with their payout address and entropy
  - A small explorer: the last 25 blocks with fees and miners, mempool, fee estimates and the next difficulty adjustment

  Point your miners at the stratum address shown in Settings (port 3336) and use your Bitcoin address as username, for example bc1q….nerdaxe-1. Miners without a valid address are refused with a message. Needs the Bitcoin Node app, pruned works.
developer: toalt23
website: https://github.com/toalt23/umbrel-store-apps
submitter: toalt23
