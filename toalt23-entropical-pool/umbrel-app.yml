releaseNotes: >-
  Explorer: the last 35 blocks, drag them sideways with the mouse, and two new cards: blocks found by home and solo miners (Solo CKPool, Public Pool, Parasite, Braiins Solo, FutureBit Apollo and more, read from the coinbase tag on your own node) this month, this year and in the last 12 months, and your own solo odds. Tx updates: pick in the entropy card whether every, every 2nd, 3rd or 4th, or no transaction update becomes a new job. The coinbase no longer carries a block nonce, fresh entropy per job comes from the extranonce1 for miners with extranonce.subscribe. Best share card: a bigger best share and the top 5 of all time, found blocks marked. Workers: click anywhere on a row, the payout address now sits in the worker dialog.
dependencies:
  - bitcoin
path: ""
defaultUsername: ""
defaultPassword: ""
