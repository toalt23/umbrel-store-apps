version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: toalt23-entropical-pool_web_1
      APP_PORT: 3000

  web:
    image: toalt23/entropical-pool-web:latest
    init: true
    restart: on-failure
    environment:
      APP_VERSION: "0.3.5"
      DATA_DIR: /data
      # Exported by Umbrel's Bitcoin Node app (dependency)
      RPC_HOST: ${APP_BITCOIN_NODE_IP}
      RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      RPC_USER: ${APP_BITCOIN_RPC_USER}
      RPC_PASSWORD: ${APP_BITCOIN_RPC_PASS}
      POOL_STRATUM_PORT: "3336"
    ports:
      # Stratum for the miners in the home network
      - "3336:3336"
    volumes:
      # Coinbase tag, pool stats and hashrate history
      - ${APP_DATA_DIR}/data/app:/data
