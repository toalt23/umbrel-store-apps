category: Development
version: "0.5.5"
port: 3430
description: |-
  Mine Pirate Chain (ARRR) solo on your Umbrel. Pirate Pool runs a full Pirate node with a built-in stratum pool and a shielded wallet, so your Equihash ASICs get their work straight from your own node. There are no pool fees and no third party in between, and every block you find pays the full reward to you.

  Follow your mining live:

  - Pool hashrate over 1, 3 or 12 hours
  - Blocks found and pool effort since the last block
  - Every worker with its hashrate, share difficulty and best share
  - Found blocks on their way to 10 confirmations

  Rewards stay private. Block rewards first land on the mining address the app creates, then they are automatically shielded into your wallet after 10 confirmations. From the wallet you can receive and send ARRR, add an encrypted memo and back up your 24-word seed. Sending and showing the seed need a wallet password.

  Setup is quick: the first start downloads the official Pirate chain snapshot (about 30 GB, checksum verified) and then syncs only the newest blocks. During setup the app needs about 75 GB of free disk space. Once the node is synced, set your wallet password, write down your seed and point your miners at the stratum address shown in Settings.
