version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: toalt23-pirate-mining-pool_web_1
      APP_PORT: 3000

  web:
    image: toalt23/pirate-mining-pool-web:latest
    init: true
    restart: on-failure
    environment:
      APP_VERSION: "0.2.1"
      DATA_DIR: /data
      CHAIN_DIR: /chain
      RPC_HOST: toalt23-pirate-mining-pool_pirated_1
      RPC_PORT: "45453"
      RPC_USER: piraterpc
      RPC_PASSWORD: ${APP_PASSWORD}
    volumes:
      # App settings and state
      - ${APP_DATA_DIR}/data/app:/data
      # Read only: parameter download progress, chain size and free disk space
      - ${APP_DATA_DIR}/data/pirate:/chain:ro
    depends_on:
      - pirated

  pirated:
    image: toalt23/pirated:6.0.14-2
    init: true
    restart: on-failure
    # the node needs time to flush its databases on shutdown
    stop_grace_period: 3m
    environment:
      # Written to PIRATE.conf by the entrypoint
      RPC_USER: piraterpc
      RPC_PASSWORD: ${APP_PASSWORD}
    command:
      - pirated
      - -datadir=/data
      - -printtoconsole
      - -dbcache=512
      # The bundled i2pd and tor daemons are not in the image
      - -i2pdautostart=0
      - -torautostart=0
    volumes:
      # Chain, wallet and proving parameters; the image fixes ownership itself
      - ${APP_DATA_DIR}/data/pirate:/data
