version: "3.7"

services:

  app_proxy:
    environment:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000APP_HOST: toalt23-ltc-doge-mining-pool_web_1
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000APP_PORT: 3000

  web:
    image: toalt23/ltc-doge-mining-pool-web:latest
    init: true
    restart: on-failure
    environment:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000DATA_DIR: /data
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000LTC_RPC_HOST: toalt23-ltc-doge-mining-pool_litecoind_1
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000LTC_RPC_PORT: "9332"
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000LTC_RPC_USER: ltcrpc
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000LTC_RPC_PASSWORD: ${APP_PASSWORD}
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000DOGE_RPC_HOST: toalt23-ltc-doge-mining-pool_dogecoind_1
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000DOGE_RPC_PORT: "22555"
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000DOGE_RPC_USER: dogerpc
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000DOGE_RPC_PASSWORD: ${APP_PASSWORD}
    volumes:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000# Config (payout addresses); same disk as the chains, used for free-space stats
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- ${APP_DATA_DIR}/data/app:/data
    depends_on:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- litecoind
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- dogecoind

  litecoind:
    image: litecoinproject/litecoin-core:0.21.5.8
    init: true
    restart: on-failure
    # nodes need time to flush their databases on shutdown
    stop_grace_period: 2m
    # args starting with "-" go to litecoind, the entrypoint adds -datadir
    command:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -printtoconsole
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -server=1
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcbind=0.0.0.0
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcallowip=0.0.0.0/0
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcuser=ltcrpc
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcpassword=${APP_PASSWORD}
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -dbcache=512
    volumes:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- ${APP_DATA_DIR}/data/litecoin:/home/litecoin/.litecoin

  dogecoind:
    image: toalt23/dogecoind:1.14.9-1
    init: true
    restart: on-failure
    stop_grace_period: 2m
    command:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- dogecoind
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -datadir=/data
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -printtoconsole
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -server=1
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcbind=0.0.0.0
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcallowip=0.0.0.0/0
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcuser=dogerpc
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -rpcpassword=${APP_PASSWORD}
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- -dbcache=512
    volumes:
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000# Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000
 Umbrel creates this from data/dogecoin/.gitkeep, owned by uid 1000- ${APP_DATA_DIR}/data/dogecoin:/data
