version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: toalt23-ltc-doge-mining-pool_web_1
      APP_PORT: 3000

  web:
    image: toalt23/ltc-doge-mining-pool-web:latest
    init: true
    restart: on-failure
    environment:
      DATA_DIR: /data
      LTC_DATA_DIR: /chains/litecoin
      DOGE_DATA_DIR: /chains/dogecoin
      LTC_RPC_HOST: toalt23-ltc-doge-mining-pool_litecoind_1
      LTC_RPC_PORT: "9332"
      LTC_RPC_USER: ltcrpc
      LTC_RPC_PASSWORD: ${APP_PASSWORD}
      DOGE_RPC_HOST: toalt23-ltc-doge-mining-pool_dogecoind_1
      DOGE_RPC_PORT: "22555"
      DOGE_RPC_USER: dogerpc
      DOGE_RPC_PASSWORD: ${APP_PASSWORD}
    volumes:
      # Config (payout addresses); same disk as the chains, used for free-space stats
      - ${APP_DATA_DIR}/data/app:/data
      # The app writes the node mode here and measures the chainstate size
      - ${APP_DATA_DIR}/data/litecoin:/chains/litecoin
      - ${APP_DATA_DIR}/data/dogecoin:/chains/dogecoin
    depends_on:
      - litecoind
      - dogecoind

  litecoind:
    image: toalt23/litecoind:0.21.5.8-1
    init: true
    restart: on-failure
    # nodes need time to flush their databases on shutdown
    stop_grace_period: 2m
    # Waits until the node mode is chosen in the app, then adds -prune
    command:
      - litecoind
      - -datadir=/data
      - -printtoconsole
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=ltcrpc
      - -rpcpassword=${APP_PASSWORD}
      - -dbcache=512
    volumes:
      # The image fixes ownership itself if Umbrel created it as root
      - ${APP_DATA_DIR}/data/litecoin:/data

  dogecoind:
    image: toalt23/dogecoind:1.14.9-2
    init: true
    restart: on-failure
    stop_grace_period: 2m
    command:
      - dogecoind
      - -datadir=/data
      - -printtoconsole
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=dogerpc
      - -rpcpassword=${APP_PASSWORD}
      - -dbcache=512
    volumes:
      # The image fixes ownership itself if Umbrel created it as root
      - ${APP_DATA_DIR}/data/dogecoin:/data
