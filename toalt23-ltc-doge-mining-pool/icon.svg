<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#232d48"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </radialGradient>
    <radialGradient id="ltc" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#7fa8ee"/>
      <stop offset="0.45" stop-color="#3c68ad"/>
      <stop offset="1" stop-color="#162c55"/>
    </radialGradient>
    <radialGradient id="doge" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fbe9a0"/>
      <stop offset="0.45" stop-color="#cfb041"/>
      <stop offset="1" stop-color="#7a6114"/>
    </radialGradient>
    <linearGradient id="rimL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0ff"/>
      <stop offset="0.5" stop-color="#5d86cc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a9c4f5"/>
    </linearGradient>
    <linearGradient id="rimD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c9"/>
      <stop offset="0.5" stop-color="#b8962c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f3dc86"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5f0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="5" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="1.5" dy="2.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <radialGradient id="lite" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d1df"/></radialGradient><rect width="256" height="256" fill="url(#lite)"/>

  <!-- DOGE coin (back) -->
  <g filter="url(#shadow)">
    <circle cx="172" cy="162" r="68" fill="url(#doge)"/>
    <circle cx="172" cy="162" r="60" fill="none" stroke="url(#rimD)" stroke-width="2.5"/>
    <g filter="url(#emboss)">
      <path d="M152 134 V198 H168 A32 32 0 0 0 168 134 Z" fill="none" stroke="#f3f5fa" stroke-width="14" stroke-linejoin="round"/>
      <path d="M138 166 H166" stroke="#f3f5fa" stroke-width="11"/>
    </g>
    <ellipse cx="150" cy="122" rx="34" ry="16" transform="rotate(-35 150 122)" fill="#fff" opacity="0.18"/>
  </g>

  <!-- LTC coin (front) -->
  <g filter="url(#shadow)">
    <circle cx="84" cy="94" r="68" fill="url(#ltc)"/>
    <circle cx="84" cy="94" r="60" fill="none" stroke="url(#rimL)" stroke-width="2.5"/>
    <g filter="url(#emboss)">
      <path d="M76 52 V128 H116" fill="none" stroke="#f3f5fa" stroke-width="16" stroke-linejoin="miter"/>
      <path d="M58 104 L100 86" stroke="#f3f5fa" stroke-width="11"/>
    </g>
    <ellipse cx="62" cy="54" rx="34" ry="16" transform="rotate(-35 62 54)" fill="#fff" opacity="0.18"/>
  </g>
</svg>
