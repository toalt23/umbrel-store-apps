releaseNotes: >-
  ZEC Mining Node is now Z-Nonce: a new name, a new logo and a new one-page dashboard with block rhythm, live share fields per worker and a worker detail view.
  Every miner now gets a random Extranonce1 that is renewed with every job. Mempool-only changes no longer interrupt your miners. A new job comes with every block, plus a heartbeat after 60 seconds without one.
  Payout addresses are checked with their full checksum, and the pool opens only once the node is synced and a payout address is set.
