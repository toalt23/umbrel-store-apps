releaseNotes: >-
  The share field now colours each share by its real difficulty: deeper gold for small shares, brighter as they grow, and a glow only from 100k up.
  The best share tile is now simply called Best share, and the effort tile reads "expected ~289.9 days".
  Worker best values and the tabs are a bit larger and easier to read.
