releaseNotes: >-
  The pool port now opens only once the node has its first mining job, so
  miners no longer sit connected without work after an app update. Saving your
  settings shows a calm "Restarting the node" note instead of an error. Long
  waits read in years and days, small block chances show real digits, and
  Settings names the difficulties Low, Medium and High. The pool hashrate chart
  now offers 3 hours, 1 day and 7 days.
