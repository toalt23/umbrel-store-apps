manifestVersion: 1
id: toalt23-zec-mining-pool
name: ZEC Mining Node
tagline: Solo-mine Zcash on your own full node
icon: https://raw.githubusercontent.com/toalt23/umbrel-store-apps/master/toalt23-zec-mining-pool/icon.svg
category: Development
version: "1.12.3"
port: 3000
description: |-
  Mine Zcash solo on your Umbrel. ZEC Mining Node runs a Zakura full node with a built-in stratum pool, so your ASICs get their work straight from your own node. There are no pool fees and no third party in between, and every block you find pays the full miner reward to your own address.

  Works with every Zcash ASIC: Antminer Z9 mini, Z9, Z11, Z15 and Z15 Pro, and Innosilicon A9, A9+ and A9++ ZMaster. Point your miners at your Umbrel and follow them live:

  - Pool hashrate over 24 hours, 7 days or 30 days
  - Your chance of finding a block within a day, a week or a month
  - Every worker with its hashrate, reject rate and best share
  - Found blocks on their way to 100 confirmations
  - A leaderboard of your closest calls

  Setup takes a minute: set your payout address, pick your miner and copy the connection details. The first blockchain sync takes several hours. You can set the address and connect your miners while it runs.
