manifestVersion: 1
id: toalt23-zec-mining-pool
name: Z-Nonce
tagline: ZEC solo mining pool with fresh entropy on every job
icon: https://raw.githubusercontent.com/toalt23/umbrel-store-apps/master/toalt23-zec-mining-pool/icon.svg?v=2.0.0
category: Development
version: "2.0.4"
port: 3000
description: |-
  Mine Zcash solo on your Umbrel. Z-Nonce runs a Zakura full node with a built-in stratum pool, so your Equihash ASICs get their work straight from your own node. There are no pool fees and no third party in between, and every block you find pays the full miner reward to your own address.

  Every miner gets a random Extranonce1, renewed with every new job. Each job your miners work on is fresh, and you can watch it happen.

  Follow your mining live on one page:

  - The block rhythm of the network with a live counter and your own Pool Hits
  - Pool hashrate over 1, 3 or 8 hours and the pool effort since your last block
  - Every worker with a live share field, its current Extranonce1 and whether it uses the fresh entropy
  - Your top 5 shares and all found blocks

  Setup takes a minute: set your payout address, let the node sync, then copy the connection details into your miner. The first blockchain sync takes several hours. The pool opens once the sync is done and a payout address is set.
